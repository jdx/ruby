name: Bump Ruby recipes on schedule or request

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  workflow_dispatch:
  schedule:
    # Hourly: look for new Ruby releases (the check job needs no checkout).
    - cron: "17 * * * *"
    # Twice a day: also look for new bundled gem versions.
    - cron: "47 4,16 * * *"

permissions:
  contents: write

concurrency:
  group: autobump
  cancel-in-progress: false

jobs:
  # Cheap pre-filter: compares upstream's tags with recipes/rubies.yml using
  # `git ls-remote` (no API calls) and a raw file fetch, so the common
  # nothing-new run needs no checkout, Ruby setup or token.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      needs_bump: ${{ steps.compare.outputs.needs_bump }}
    steps:
      - name: Compare upstream tags with the recipes
        id: compare
        env:
          RECIPES_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/recipes/rubies.yml
        run: |
          set -euo pipefail
          # Every release has a tag, so the tag list is a superset of the
          # release list the bump job reads: this can only over-report.
          all_tags=$(git ls-remote --tags https://github.com/ruby/ruby.git \
            | sed -n 's|.*refs/tags/||p' | grep -v '\^{}$')
          recipes=$(curl -fsSL --retry 3 "$RECIPES_URL" | yq '.rubies | keys | .[]')

          has_recipe() { grep -qxF -- "$1" <<< "$recipes"; }
          needs_bump=false

          stable=$(grep -viE '(preview|rc)' <<< "$all_tags" | sed 's/^v//; s/_/./g' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          series=$(grep -oE '^[0-9]+\.[0-9]+' <<< "$stable" | sort -V -u | awk -F. '$1 > 3 || ($1 == 3 && $2 >= 2)')
          for minor in $series; do
            latest=$(grep -E "^${minor//./\\.}\.[0-9]+$" <<< "$stable" | sort -V | tail -1)
            if ! has_recipe "$latest"; then
              echo "New stable Ruby: $latest"
              needs_bump=true
            fi
          done

          while read -r tag; do
            [ -n "$tag" ] || continue
            if grep -q '\.' <<< "$tag"; then
              version=${tag#v}
            else
              version=$(sed 's/^v//; s/_/./g' <<< "$tag" | sed 's/\.\(preview\)/-\1/i; s/\.\(rc\)/-\1/i')
            fi
            minor=$(grep -oE '^[0-9]+\.[0-9]+' <<< "$version" || true)
            [ -n "$minor" ] || continue
            awk -F. '$1 > 3 || ($1 == 3 && $2 >= 2) { ok = 1 } END { exit !ok }' <<< "$minor" || continue
            if grep -qxE "v${minor//./_}_[0-9]+|v${minor//./\\.}\.[0-9]+" <<< "$all_tags"; then
              continue
            fi
            if ! has_recipe "$version"; then
              echo "New prerelease Ruby: $version"
              needs_bump=true
            fi
          done < <(grep -iE '(preview|rc)' <<< "$all_tags" || true)

          echo "needs_bump=$needs_bump" >> "$GITHUB_OUTPUT"
          echo "needs_bump=$needs_bump"

  autobump:
    needs: check
    if: needs.check.outputs.needs_bump == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for new stable Ruby versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          all_tags=$(gh release list --repo ruby/ruby --limit 200 --json tagName --jq '.[].tagName')

          minor_versions=$(echo "$all_tags" | grep -v -iE '(preview|rc)' | \
            sed 's/^v//; s/_/./g' | \
            grep -oE '^[0-9]+\.[0-9]+' | \
            sort -V -u)
          minor_versions=$(echo "$minor_versions" | awk -F. '$1 > 3 || ($1 == 3 && $2 >= 2)')

          echo "Discovered minor series: $(echo $minor_versions | tr '\n' ' ')"

          for minor in $minor_versions; do
            underscore_prefix="v${minor//./_}_"
            dot_prefix="v${minor//./\\.}\\."
            latest=$(echo "$all_tags" | \
              grep -E "^(${underscore_prefix}|${dot_prefix})" | \
              grep -viE '(preview|rc)' | \
              sed 's/^v//; s/_/./g' | \
              grep -E "^${minor}\.[0-9]+$" | \
              sort -V | tail -1)

            if [[ -z "$latest" ]]; then
              echo "No release found for $minor series"
              continue
            fi

            if ruby -ryaml -e 'exit(YAML.load_file("recipes/rubies.yml").fetch("rubies").key?(ARGV.fetch(0)) ? 0 : 1)' "$latest"; then
              echo "Recipe already exists: $latest"
              continue
            fi

            tarball_url="https://cache.ruby-lang.org/pub/ruby/${minor}/ruby-${latest}.tar.gz"
            echo "Fetching SHA256 for $tarball_url"
            if ! curl -fsSL "$tarball_url" -o /tmp/ruby.tar.gz; then
              echo "Failed to download $tarball_url"
              continue
            fi
            sha256=$(sha256sum /tmp/ruby.tar.gz | cut -d' ' -f1)

            bin/update-ruby-recipe "$latest" "$tarball_url" "$sha256"
            bin/validate-recipes
            if ! git diff --quiet -- recipes/rubies.yml recipes/series.yml; then
              git add recipes/rubies.yml recipes/series.yml
              git commit -m "Add Ruby ${latest}"
            fi
          done

      - name: Check for prerelease Ruby versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          all_releases=$(gh release list --repo ruby/ruby --limit 200 --json tagName --jq '.[].tagName')

          echo "$all_releases" | while read -r tag; do
            if ! echo "$tag" | grep -qiE '(preview|rc)'; then
              continue
            fi

            if echo "$tag" | grep -q '\.'; then
              version=$(echo "$tag" | sed 's/^v//')
            else
              version=$(echo "$tag" | sed 's/^v//; s/_/./g' | sed 's/\.\(preview\)/-\1/i; s/\.\(rc\)/-\1/i')
            fi

            minor=$(echo "$version" | grep -oE '^[0-9]+\.[0-9]+')
            underscore_pattern="^v${minor//./_}_[0-9]+$"
            dot_pattern="^v${minor//./\\.}\.[0-9]+$"
            if echo "$all_releases" | grep -qE "(${underscore_pattern}|${dot_pattern})"; then
              echo "Skipping $version - stable releases exist for $minor series"
              continue
            fi

            if ruby -ryaml -e 'exit(YAML.load_file("recipes/rubies.yml").fetch("rubies").key?(ARGV.fetch(0)) ? 0 : 1)' "$version"; then
              echo "Recipe already exists: $version"
              continue
            fi

            tarball_url="https://cache.ruby-lang.org/pub/ruby/${minor}/ruby-${version}.tar.gz"
            echo "Fetching SHA256 for $tarball_url"
            if ! curl -fsSL "$tarball_url" -o /tmp/ruby.tar.gz; then
              echo "Failed to download $tarball_url"
              continue
            fi
            sha256=$(sha256sum /tmp/ruby.tar.gz | cut -d' ' -f1)

            bin/update-ruby-recipe "$version" "$tarball_url" "$sha256"
            bin/validate-recipes
            if ! git diff --quiet -- recipes/rubies.yml recipes/series.yml; then
              git add recipes/rubies.yml recipes/series.yml
              git commit -m "Add Ruby ${version}"
            fi
          done

      - name: Push changes
        run: |
          if git log --oneline "origin/${GITHUB_REF_NAME}..HEAD" | grep -q .; then
            git push
          else
            echo "No recipe changes to push"
          fi

  bundled-gems:
    # Not on the hourly schedule: gem releases are slow, and the script queries rubygems.
    if: github.event.schedule != '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump bundled gems
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          branch=autobump/bundled-gems
          open_prs=$(gh pr list --head "$branch" --state open --json number --jq '.[].number')
          if [ -n "$open_prs" ]; then
            echo "A bundled gems bump PR is already open"
            exit 0
          fi

          git fetch origin main
          git checkout -B "$branch" origin/main
          summary=$(bin/update-bundled-gems)
          echo "$summary"
          if git diff --quiet -- recipes/series.yml; then
            exit 0
          fi

          bin/validate-recipes
          git add recipes/series.yml
          git commit -m "chore(deps): bump bundled gems" -m "$summary"
          git push --force origin "$branch"
          body=$(mktemp)
          {
            echo "Newest stable releases of the gems staged into every portable Ruby, within the same major version and the series minimum Ruby."
            echo
            while IFS= read -r line; do echo "- $line"; done <<< "$summary"
            echo
            echo "Opened by the autobump workflow; the build jobs validate the new gems."
          } > "$body"
          gh pr create --base main --head "$branch" \
            --title "chore(deps): bump bundled gems" \
            --body-file "$body"

  notify-failure:
    needs: [check, autobump, bundled-gems]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${NOTIFY_EMAIL:-}" ]; then
            echo "::warning::RESEND_API_KEY or NOTIFY_EMAIL is unset; skipping autobump failure notification"
            exit 0
          fi
          payload=$(jq -n \
            --arg to "$NOTIFY_EMAIL" \
            --arg run_url "$RUN_URL" \
            '{
              from: "Ruby Releases <ruby@en.dev>",
              to: [$to],
              subject: "❌ Ruby autobump failed",
              html: ("<p>The autobump workflow failed, so new Ruby releases are not being picked up.</p><p><a href=\"\($run_url | @html)\">View workflow run</a></p>")
            }')
          curl --fail-with-body -sS \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$payload"
