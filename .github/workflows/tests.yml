name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Validate recipes
        run: bin/validate-recipes
      - name: Check Ruby syntax
        run: |
          ruby -c libexec/package.rb
          ruby -c libexec/validate_recipes.rb
          ruby -c libexec/update_ruby_recipe.rb
          ruby -c libexec/update_bundled_gems.rb

  build:
    needs: syntax
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      version: 3.4.1

  # Ruby 3.2 and 3.3 carry their own bundled gem pins, which the 3.4.1 build
  # above does not exercise, so check them on the autobump gem PR.
  build-older:
    needs: syntax
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'autobump/')
    strategy:
      fail-fast: false
      matrix:
        version: ["3.2.9", "3.3.14"]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ matrix.version }}

  final:
    needs:
      - syntax
      - build
      - build-older
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    steps:
      - name: Check CI job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
